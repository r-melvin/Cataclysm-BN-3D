<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t-fd">
<title id="t-fd">What an engine move can save versus what it costs, in developer-weeks. The saving is capped at about ten weeks of accessibility work; the cheapest engine (Godot) adds twenty to thirty weeks of renderer, compute and embedding work.</title>
<g font-size="13">
  <text x="20" y="30" class="d-text" font-weight="600">Accessibility work in the plan, and who can supply it</text>
  <g class="d-text-2">
    <text x="20" y="56">1. UI tree with names, roles, values</text>
    <text x="20" y="78">2. Narrator: what to say, when</text>
    <text x="20" y="100">3. OS bridge (UIA / NSAccessibility / AT-SPI)</text>
    <text x="20" y="122">4. Remapping, gamepad, scale, colour modes</text>
    <text x="20" y="144">5. Per-screen reading-order design</text>
  </g>
  <g font-size="12">
    <text x="340" y="56" class="d-text-2">engine supplies (as its widgets)</text>
    <text x="340" y="78" class="d-critical" font-weight="600">no engine supplies</text>
    <text x="340" y="100" class="d-text-2">Godot supplies; others partial</text>
    <text x="340" y="122" class="d-text-2">engine supplies part</text>
    <text x="340" y="144" class="d-critical" font-weight="600">no engine supplies (MK1, Sea of Thieves did it per screen)</text>
  </g>

  <!-- bars: scale 12 px per week, origin x=300 -->
  <text x="20" y="196" class="d-text" font-weight="600">Saved by moving (upper bound)</text>
  <g>
    <text x="20" y="220" class="d-text-2">M1 widget layer</text>
    <rect x="300" y="210" width="60" height="12" rx="4" class="d-s3"><title>M1 widget layer: 5 weeks saved</title></rect><text x="366" y="221" class="d-text-2">5 wk</text>
    <text x="20" y="242" class="d-text-2">M12 AccessKit bridge</text>
    <rect x="300" y="232" width="36" height="12" rx="4" class="d-s3"><title>M12 bridge: 3 weeks saved</title></rect><text x="342" y="243" class="d-text-2">3 wk</text>
    <text x="20" y="264" class="d-text-2">Half of M2 (gamepad plumbing)</text>
    <rect x="300" y="254" width="18" height="12" rx="4" class="d-s3"><title>Half of M2: 1.5 weeks saved</title></rect><text x="324" y="265" class="d-text-2">1.5 wk</text>
    <text x="20" y="286" class="d-text" font-weight="600">Total</text>
    <rect x="300" y="276" width="114" height="12" rx="4" class="d-s3"><title>Total saving: about 9.5 weeks</title></rect><text x="420" y="287" class="d-text" font-weight="600">~10 wk</text>
  </g>

  <text x="20" y="326" class="d-text" font-weight="600">Added by Godot (option B), mid estimates</text>
  <g>
    <text x="20" y="350" class="d-text-2">Embedding + threading bridge</text>
    <rect x="300" y="340" width="60" height="12" rx="4" class="d-s2"><title>Embedding and threading bridge: 4-6 weeks</title></rect><text x="366" y="351" class="d-text-2">4-6 wk</text>
    <text x="20" y="372" class="d-text-2">Renderer + compute port, re-validation</text>
    <rect x="300" y="362" width="228" height="12" rx="4" class="d-s2"><title>Renderer and compute port plus re-validation: 15-24 weeks</title></rect><text x="534" y="373" class="d-text-2">15-24 wk</text>
    <text x="20" y="394" class="d-text" font-weight="600">Net</text>
    <rect x="300" y="384" width="228" height="12" rx="4" class="d-s8"><title>Net cost of moving: about 20-30 weeks more than staying</title></rect><text x="534" y="395" class="d-text" font-weight="600">+20-30 wk, low confidence</text>
  </g>
  <g class="d-line-soft"><line x1="300" y1="200" x2="300" y2="404"/><line x1="420" y1="200" x2="420" y2="404" stroke-dasharray="3 3"/><line x1="540" y1="200" x2="540" y2="404" stroke-dasharray="3 3"/></g>
  <g class="d-text-3" text-anchor="middle"><text x="300" y="414">0</text><text x="420" y="414">10</text><text x="540" y="414">20 weeks</text></g>

  <text x="620" y="220" class="d-text" font-weight="600">Flip to Godot only if all hold:</text>
  <g class="d-text-2">
    <text x="620" y="242">1. accesskit-c fails with 2 of 3 readers</text>
    <text x="620" y="258">   in the M0/M1 spike, and</text>
    <text x="620" y="280">2. the renderer is being replaced anyway, and</text>
    <text x="620" y="302">3. a second developer for 6+ months.</text>
    <text x="620" y="330">Or: the project targets mobile/console.</text>
  </g>
</g>
</svg>
