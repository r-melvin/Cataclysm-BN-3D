<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t-ms">
<title id="t-ms">Milestone dependencies. Thick blue borders mark the critical path (M0 to M11); diamonds are gates that need a decision; dashed boxes run in parallel streams. M12 is optional.</title>
<defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrow"/></marker></defs>
<g font-size="12">
  <!-- column 1 -->
  <rect x="20" y="150" width="90" height="44" rx="6" class="d-box d-stroke-s1" stroke-width="2.5"/>
  <text x="65" y="168" text-anchor="middle" class="d-text" font-weight="600">M0 spike</text><text x="65" y="184" text-anchor="middle" class="d-text-3">1 wk</text>

  <rect x="140" y="150" width="100" height="44" rx="6" class="d-box d-stroke-s1" stroke-width="2.5"/>
  <text x="190" y="168" text-anchor="middle" class="d-text" font-weight="600">M1 foundation</text><text x="190" y="184" text-anchor="middle" class="d-text-3">4-6 wk, Settings</text>
  <!-- gate -->
  <polygon points="190,206 212,228 190,250 168,228" class="d-box" stroke="var(--warn)" stroke-width="2"/>
  <text x="190" y="232" text-anchor="middle" class="d-text" font-size="10">gate</text>
  <text x="190" y="266" text-anchor="middle" class="d-text-3">accesskit-c works?</text>
  <text x="190" y="280" text-anchor="middle" class="d-text-3">else re-cost Godot</text>

  <!-- column 2 -->
  <rect x="280" y="60" width="110" height="44" rx="6" class="d-box" stroke-dasharray="5 3"/>
  <text x="335" y="78" text-anchor="middle" class="d-text" font-weight="600">M1.5 curses ph.1</text><text x="335" y="94" text-anchor="middle" class="d-text-3">1 wk</text>

  <rect x="280" y="150" width="110" height="44" rx="6" class="d-box d-stroke-s1" stroke-width="2.5"/>
  <text x="335" y="168" text-anchor="middle" class="d-text" font-weight="600">M2 input</text><text x="335" y="184" text-anchor="middle" class="d-text-3">2-3 wk, gamepad</text>

  <rect x="280" y="240" width="110" height="44" rx="6" class="d-box" stroke-dasharray="5 3"/>
  <text x="335" y="258" text-anchor="middle" class="d-text" font-weight="600">M4 config file</text><text x="335" y="274" text-anchor="middle" class="d-text-3">2 wk</text>

  <!-- column 3 -->
  <polygon points="460,110 482,132 460,154 438,132" class="d-box" stroke="var(--warn)" stroke-width="2"/>
  <text x="460" y="136" text-anchor="middle" class="d-text" font-size="10">HUD ok?</text>
  <rect x="420" y="160" width="110" height="44" rx="6" class="d-box d-stroke-s1" stroke-width="2.5"/>
  <text x="475" y="178" text-anchor="middle" class="d-text" font-weight="600">M3 HUD + sidebar</text><text x="475" y="194" text-anchor="middle" class="d-text-3">4-5 wk</text>

  <!-- column 4 -->
  <rect x="560" y="60" width="110" height="44" rx="6" class="d-box" stroke-dasharray="5 3"/>
  <text x="615" y="78" text-anchor="middle" class="d-text" font-weight="600">M6 char/journal/map</text><text x="615" y="94" text-anchor="middle" class="d-text-3">4-6 wk</text>

  <rect x="560" y="160" width="110" height="44" rx="6" class="d-box d-stroke-s1" stroke-width="2.5"/>
  <text x="615" y="178" text-anchor="middle" class="d-text" font-weight="600">M5 inventory</text><text x="615" y="194" text-anchor="middle" class="d-text-3">6-8 wk</text>

  <rect x="560" y="250" width="110" height="44" rx="6" class="d-box" stroke-dasharray="5 3"/>
  <text x="615" y="268" text-anchor="middle" class="d-text" font-weight="600">M8 accessibility</text><text x="615" y="284" text-anchor="middle" class="d-text-3">3 wk</text>

  <rect x="560" y="340" width="110" height="44" rx="6" class="d-box" stroke-dasharray="5 3"/>
  <text x="615" y="358" text-anchor="middle" class="d-text" font-weight="600">M9 ref/menus/new game</text><text x="615" y="374" text-anchor="middle" class="d-text-3">4-5 wk</text>

  <!-- column 5 -->
  <rect x="700" y="160" width="110" height="44" rx="6" class="d-box d-stroke-s1" stroke-width="2.5"/>
  <text x="755" y="178" text-anchor="middle" class="d-text" font-weight="600">M7 craft/build/cursor</text><text x="755" y="194" text-anchor="middle" class="d-text-3">4-6 wk</text>

  <rect x="700" y="340" width="110" height="44" rx="6" class="d-box" stroke-dasharray="5 3"/>
  <text x="755" y="358" text-anchor="middle" class="d-text" font-weight="600">M9.5 UI-01 guided start</text><text x="755" y="374" text-anchor="middle" class="d-text-3">3 wk</text>

  <!-- column 6 -->
  <rect x="840" y="160" width="100" height="44" rx="6" class="d-box d-stroke-s1" stroke-width="2.5"/>
  <text x="890" y="178" text-anchor="middle" class="d-text" font-weight="600">M10 vehicle</text><text x="890" y="194" text-anchor="middle" class="d-text-3">4-6 wk</text>

  <rect x="840" y="250" width="100" height="44" rx="6" class="d-box d-stroke-s1" stroke-width="2.5"/>
  <text x="890" y="268" text-anchor="middle" class="d-text" font-weight="600">M11 retire legacy</text><text x="890" y="284" text-anchor="middle" class="d-text-3">3 wk + curses ph.3</text>

  <rect x="840" y="340" width="100" height="44" rx="6" class="d-box" stroke-dasharray="2 3"/>
  <text x="890" y="358" text-anchor="middle" class="d-text" font-weight="600">M12 AccessKit</text><text x="890" y="374" text-anchor="middle" class="d-text-3">optional, gated</text>

  <!-- arrows -->
  <g class="d-line" marker-end="url(#ah3)">
    <path d="M110,172 H138"/>
    <path d="M240,172 H278"/>
    <path d="M240,172 Q260,172 260,120 Q260,82 278,82"/>
    <path d="M240,172 Q260,172 260,230 Q260,262 278,262"/>
    <path d="M390,172 H418"/>
    <path d="M530,182 H558"/>
    <path d="M530,182 Q545,182 545,120 Q545,82 558,82"/>
    <path d="M530,182 Q545,182 545,240 Q545,272 558,272"/>
    <path d="M390,262 Q470,262 470,340 Q470,362 558,362"/>
    <path d="M670,182 H698"/>
    <path d="M670,362 H698"/>
    <path d="M670,82 Q690,82 690,300 Q690,350 698,352"/>
    <path d="M810,182 H838"/>
    <path d="M890,204 V248"/>
    <path d="M810,362 Q830,362 830,300 Q830,272 838,272"/>
    <path d="M890,294 V338" stroke-dasharray="3 3"/>
  </g>
  <text x="20" y="420" class="d-text-3">Critical path about 26-34 weeks for one developer, 17-21 with two. Parallel streams: M1.5 + M2 + M4 after the gate; M5 + M6 + M8 after M3; M9 after M4.</text>
</g>
</svg>
